name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA; Dependabot (github-actions) moves the pins.
# Read-only unless a job asks for more; only the Pages deploy does.
permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7

jobs:
  # Ubuntu is pinned in every job: ubuntu-latest follows each new release
  # (26.04 from October 2026), and the Linux build compiles against the
  # system GTK and clang. Moving to a newer release is a change made here.
  verify:
    name: Analyze and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: |
          flutter pub get
          dart pub get --directory packages/matrix_engine

      - name: Check generated localizations are current
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n/generated

      - name: Analyze
        run: |
          flutter analyze
          dart analyze packages/matrix_engine

      - name: Test app
        run: flutter test

      - name: Test engine
        working-directory: packages/matrix_engine
        run: dart test

      # Branches other than main never deploy; they publish the web build as a
      # downloadable artifact so a change can be reviewed in a browser first.
      - name: Build web preview
        if: github.ref != 'refs/heads/main'
        run: flutter build web --release --no-web-resources-cdn

      - name: Upload web preview
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-preview
          path: build/web
          retention-days: 14

      # Last, so a formatting slip still leaves test results and the preview
      # to look at; the diff it prints is the fix. Generated localizations
      # are left as gen-l10n writes them.
      - name: Check formatting
        run: |
          dart format $(git ls-files '*.dart' | grep -v '^lib/l10n/generated/')
          git diff --exit-code

  # The verify job builds only the web app. A change to the Android, Windows
  # or Linux shells (manifests, runners) is otherwise compiled nowhere before
  # it merges. Pull requests only: main already passed this as a PR.
  platforms:
    name: Build ${{ matrix.target }}
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: apk
            os: ubuntu-24.04
          - target: windows
            os: windows-latest
          - target: linux
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: matrix.target == 'apk'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        run: |
          flutter pub get
          flutter build ${{ matrix.target }} --release

  deploy:
    name: Deploy web to GitHub Pages
    needs: verify
    # Only main publishes. A manual run on another branch verifies and builds a
    # preview artifact but must not replace the live site.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        id: pages

      - name: Build web
        # base_path carries the repository subdirectory Pages serves from, so a
        # rename or a move to a custom domain needs no edit here.
        # CanvasKit is served from the deployed site rather than a CDN: the app
        # makes no backend calls and a third-party fetch would contradict that.
        # Symbols and the Chinese interface come from the bundled MatriksSymbols
        # and MatriksCJK fonts, so no glyphs are fetched from fonts.gstatic.com;
        # only Chinese a learner types outside that subset would be.
        run: |
          flutter pub get
          dart pub get --directory packages/matrix_engine
          flutter gen-l10n
          flutter build web --release \
            --base-href "${{ steps.pages.outputs.base_path }}/" \
            --no-web-resources-cdn

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
