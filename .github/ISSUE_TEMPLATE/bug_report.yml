name: Bug report
description: A wrong result, a broken animation, or a layout problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a wrong result, the exact matrix you entered matters more than anything
        else — it is what makes the problem reproducible.

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Gauss-Jordan elimination (RREF)
        - Gaussian elimination (REF)
        - Linear system (Ax = b)
        - Determinant
        - Inverse
        - Rank and nullity
        - Eigenvalues and eigenvectors
        - LU decomposition
        - Addition
        - Multiplication
        - 2D transformations
        - Practice quiz
        - Settings, navigation or something else
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Input
      description: The matrix (or matrices) exactly as entered, one row per line.
      placeholder: |
        2 0 1
        1 3 2
        1 1 1
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
      description: >
        If the answer is mathematically wrong, show the value you worked out. If a step
        is skipped or a cell highlights wrongly, say which step number.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Where
      options:
        - Web (https://iacbi.github.io/matriks/)
        - Web (self-hosted or local build)
        - Windows
        - Other platform
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser or OS version
      placeholder: Firefox 142 on Windows 11

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: >
        Language, light or dark theme, window width, playback speed, or a screenshot —
        whichever seemed to matter.
